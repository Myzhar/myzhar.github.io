<!-- Google Consent Mode v2 defaults + Google tag + Google Tag Manager bootstrap -->
<!-- Must run BEFORE gtag.js, gtm.js, AdSense and Klaro, so that no hit is sent without a consent state -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  // 1. Consent defaults: everything denied until the visitor chooses in Klaro.
  //    wait_for_update gives Klaro (deferred) time to restore a previous "accept"
  //    before the first hits are sent.
  gtag('consent', 'default', {
    'ad_storage': 'denied',
    'analytics_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied',
    'wait_for_update': 1000
  });
  gtag('set', 'ads_data_redaction', true);
  gtag('set', 'url_passthrough', true);

  // 2. Google tag (GA4)
  gtag('js', new Date());
  gtag('config', 'G-PYMBS7K65Z');

  // 3. Google Tag Manager start event
  dataLayer.push({'gtm.start': new Date().getTime(), 'event': 'gtm.js'});
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PYMBS7K65Z"></script>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-WPN5V2NZ"></script>

<!-- Cookie KiProtect / Klaro -->
<script defer src="https://api.kiprotect.com/v1/privacy-managers/b5fd1fcfcf3323c6537a72e06707373d/klaro.js"></script>

<!-- Sync Klaro choices with Google Consent Mode, on every page load and on every change -->
<script>
  (function () {
    var GA_SERVICE  = "google-analytics";          // Klaro service name for GA4
    var ADS_SERVICE = "google-marketing-platform"; // Klaro service name for ads / AdSense
    var hooked = false;

    function state(manager, service) {
      return (manager && manager.confirmed && manager.consents[service]) ? 'granted' : 'denied';
    }

    function apply(manager) {
      var ads = state(manager, ADS_SERVICE);
      gtag('consent', 'update', {
        'analytics_storage': state(manager, GA_SERVICE),
        'ad_storage': ads,
        'ad_user_data': ads,
        'ad_personalization': ads
      });
    }

    function hook() {
      if (hooked || !window.klaro || typeof window.klaro.getManager !== "function") return;
      hooked = true;
      var manager = window.klaro.getManager();
      apply(manager);
      manager.watch({ update: function () { apply(manager); } });
    }

    hook();
    document.addEventListener("DOMContentLoaded", hook);
    window.addEventListener("load", hook);
  })();
</script>

<!-- Microsoft Clarity tracking code for https://myzhar.tech/ -->
<!-- Loaded only once the analytics group is accepted in the consent manager, see /privacy/ -->
<script>
    (function () {
        var CLARITY_ID = "x1tuf2d0al";
        var SERVICE = "microsoft clarity"; // service name as declared in the consent manager
        var loaded = false, hooked = false;

        function loadClarity() {
            if (loaded) return;
            loaded = true;
            (function(c,l,a,r,i,t,y){
                c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i+"?ref=bwt";
                y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
            })(window, document, "clarity", "script", CLARITY_ID);
        }

        // Clarity keeps its own first-party cookies, which the consent manager does not
        // know about, so they have to be dropped by hand when consent is withdrawn.
        function clearClarityCookies() {
            document.cookie.split(";").forEach(function (entry) {
                var name = entry.split("=")[0].trim();
                if (name === "_clck" || name === "_clsk") {
                    document.cookie = name + "=; Max-Age=0; path=/";
                    document.cookie = name + "=; Max-Age=0; path=/; domain=" + location.hostname;
                }
            });
        }

        function accepted(manager) {
            return Boolean(manager && manager.confirmed && manager.consents[SERVICE]);
        }

        function apply(manager) {
            if (accepted(manager)) loadClarity();
            else clearClarityCookies();
        }

        function hook() {
            if (hooked || !window.klaro || typeof window.klaro.getManager !== "function") return;
            hooked = true;
            var manager = window.klaro.getManager();
            apply(manager);
            manager.watch({ update: function () { apply(manager); } });
        }

        // The consent manager is deferred, so it is only guaranteed to be there once
        // the document has been parsed.
        hook();
        document.addEventListener("DOMContentLoaded", hook);
        window.addEventListener("load", hook);
    })();
</script>
