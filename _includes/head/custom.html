<!-- start custom head snippets -->

<!-- insert favicons. use https://realfavicongenerator.net/ -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon/favicon-16x16.png">
<link rel="manifest" href="/assets/images/favicon/site.webmanifest">
<link rel="mask-icon" href="/assets/images/favicon/safari-pinned-tab.svg" color="#5bbad5">
<link rel="shortcut icon" href="/assets/images/favicon/favicon.ico">
<meta name="msapplication-TileColor" content="#da532c">
<meta name="msapplication-config" content="/assets/images/favicon/browserconfig.xml">
<meta name="theme-color" content="#ffffff">

<!-- Preconnect to external origins -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://consent.cookiebot.com">
<link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin>
<link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>

<!-- LCP preload: hero background image used on splash/home pages -->
{% if page.header.overlay_image %}<link rel="preload" as="image" href="{{ page.header.overlay_image | relative_url }}" fetchpriority="high">{% endif %}

<!-- CookieConsent CSS loaded non-render-blocking -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.css"></noscript>

<!-- CookieBot - Before every script -->
<script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="e399cfb4-af9c-47ca-b926-16983c6fdbfe" data-blockingmode="auto" type="text/javascript"></script>

<!-- Adsense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4858725679126097" crossorigin="anonymous"></script>

<!-- Adsense Meta -->
<meta name="google-adsense-account" content="ca-pub-4858725679126097">

<!-- Handle 'noindex' in front matter -->
{% if page.noindex %}
  <meta name="robots" content="noindex, nofollow">
{% endif %}

<!-- end custom head snippets -->
