<!-- Microsoft Clarity tracking code for https://myzhar.tech/ -->
<!-- Loaded only once the analytics group is accepted in the consent manager, see /privacy/ -->
<script>
    (function () {
        var CLARITY_ID = "x1tuf2d0al";
        var SERVICE = "microsoft clarity"; // service name as declared in the consent manager
        var loaded = false, hooked = false;

        function loadClarity() {
            if (loaded) return;
            loaded = true;
            (function(c,l,a,r,i,t,y){
                c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i+"?ref=bwt";
                y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
            })(window, document, "clarity", "script", CLARITY_ID);
        }

        // Clarity keeps its own first-party cookies, which the consent manager does not
        // know about, so they have to be dropped by hand when consent is withdrawn.
        function clearClarityCookies() {
            document.cookie.split(";").forEach(function (entry) {
                var name = entry.split("=")[0].trim();
                if (name === "_clck" || name === "_clsk") {
                    document.cookie = name + "=; Max-Age=0; path=/";
                    document.cookie = name + "=; Max-Age=0; path=/; domain=" + location.hostname;
                }
            });
        }

        function accepted(manager) {
            return Boolean(manager && manager.confirmed && manager.consents[SERVICE]);
        }

        function apply(manager) {
            if (accepted(manager)) loadClarity();
            else clearClarityCookies();
        }

        function hook() {
            if (hooked || !window.klaro || typeof window.klaro.getManager !== "function") return;
            hooked = true;
            var manager = window.klaro.getManager();
            apply(manager);
            manager.watch({ update: function () { apply(manager); } });
        }

        // The consent manager is deferred, so it is only guaranteed to be there once
        // the document has been parsed.
        hook();
        document.addEventListener("DOMContentLoaded", hook);
        window.addEventListener("load", hook);
    })();
</script>
