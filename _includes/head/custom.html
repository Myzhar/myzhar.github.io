<!-- Google Consent Mode v2 defaults + Google tag + Google Tag Manager bootstrap -->
<!-- Must run BEFORE gtag.js, gtm.js, AdSense and Klaro, so that no hit is sent without a consent state -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  // 1. Consent defaults: everything denied until the visitor chooses in Klaro.
  //    No wait_for_update: Klaro pushes its own late "consent default", which
  //    makes gtag drop the page_view held back while waiting.
  gtag('consent', 'default', {
    'ad_storage': 'denied',
    'analytics_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied'
  });
  gtag('set', 'ads_data_redaction', true);
  gtag('set', 'url_passthrough', true);

  // 2. Google tag (GA4)
  gtag('js', new Date());
  gtag('config', 'G-PYMBS7K65Z');

  // 3. Google Tag Manager start event
  dataLayer.push({'gtm.start': new Date().getTime(), 'event': 'gtm.js'});
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PYMBS7K65Z"></script>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-WPN5V2NZ"></script>

<!-- Cookie KiProtect / Klaro -->
<script defer src="https://api.kiprotect.com/v1/privacy-managers/b5fd1fcfcf3323c6537a72e06707373d/klaro.js"></script>

<!-- Sync Klaro choices with Google Consent Mode, on every page load and on every change -->
<script>
  (function () {
    var GA_SERVICE  = "google-analytics";          // Klaro service name for GA4
    var ADS_SERVICE = "google-marketing-platform"; // Klaro service name for ads / AdSense
    var hooked = false;

    function state(manager, service) {
      return (manager && manager.confirmed && manager.consents[service]) ? 'granted' : 'denied';
    }

    function apply(manager) {
      var ads = state(manager, ADS_SERVICE);
      gtag('consent', 'update', {
        'analytics_storage': state(manager, GA_SERVICE),
        'ad_storage': ads,
        'ad_user_data': ads,
        'ad_personalization': ads
      });
    }

    function hook() {
      if (hooked || !window.klaro || typeof window.klaro.getManager !== "function") return;
      hooked = true;
      var manager = window.klaro.getManager();
      apply(manager);
      manager.watch({ update: function () { apply(manager); } });
    }

    hook();
    document.addEventListener("DOMContentLoaded", hook);
    window.addEventListener("load", hook);
  })();
</script>
