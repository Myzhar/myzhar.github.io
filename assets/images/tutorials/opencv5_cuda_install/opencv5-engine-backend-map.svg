<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 830" width="1560" height="830">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#76b900"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <filter id="gl-b" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1560" height="830" fill="#0d1117"/>

  <text x="780" y="46" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" font-weight="bold" fill="#e2e8f0">
    OpenCV 5: three DNN engines, one of them can reach your GPU
  </text>

  <!-- model -->
  <rect x="640" y="76" width="280" height="52" rx="10" fill="#1f2937" stroke="#fbbf24" stroke-width="2"/>
  <text x="780" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#fbbf24">model.onnx</text>
  <line x1="780" y1="128" x2="780" y2="158" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- readNet -->
  <rect x="470" y="158" width="620" height="60" rx="10" fill="#111827" stroke="#64748b" stroke-width="2"/>
  <text x="780" y="196" text-anchor="middle" font-family="'Courier New', monospace" font-size="17" fill="#e2e8f0">readNetFromONNX(path, engine = ENGINE_AUTO)</text>

  <!-- fan-out arrows -->
  <path d="M 600 218 L 600 250 L 280 250 L 280 288" fill="none" stroke="#76b900" stroke-width="2.5" marker-end="url(#ar-green)"/>
  <text x="300" y="242" font-family="'Courier New', monospace" font-size="14" fill="#a3e635">engine=ENGINE_CLASSIC</text>

  <line x1="780" y1="218" x2="780" y2="288" stroke="#f472b6" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="795" y="258" font-family="'Courier New', monospace" font-size="14" fill="#f472b6">AUTO tries this first</text>

  <path d="M 960 218 L 960 250 L 1280 250 L 1280 288" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="1090" y="242" font-family="'Courier New', monospace" font-size="14" fill="#94a3b8">engine=ENGINE_ORT</text>

  <!-- ===== column 1: CLASSIC ===== -->
  <rect x="60" y="288" width="440" height="300" rx="12" fill="#0f2d18" stroke="#76b900" stroke-width="2.5" filter="url(#gl-b)"/>
  <rect x="60" y="288" width="440" height="46" rx="12" fill="#76b900" opacity="0.18"/>
  <text x="280" y="319" text-anchor="middle" font-family="'Courier New', monospace" font-size="19" font-weight="bold" fill="#a3e635">ENGINE_CLASSIC</text>
  <g font-family="'Courier New', monospace" font-size="14">
    <text x="82" y="368" fill="#94a3b8">the 4.x engine, kept alive</text>
    <text x="82" y="398" fill="#cbd5e1">ONNX coverage</text><text x="478" y="398" text-anchor="end" fill="#fbbf24">~23%</text>
    <text x="82" y="426" fill="#cbd5e1">needs at build time</text>
    <text x="98" y="452" fill="#a3e635">WITH_CUDA + WITH_CUDNN</text>
    <text x="98" y="474" fill="#a3e635">OPENCV_DNN_CUDA=ON</text>
    <text x="98" y="496" fill="#a3e635">opencv_contrib (cudev)</text>
    <text x="82" y="526" fill="#cbd5e1">backends</text><text x="478" y="526" text-anchor="end" fill="#93c5fd">CPU, CUDA, OpenCL</text>
    <text x="82" y="556" fill="#cbd5e1">GPU inference</text><text x="478" y="556" text-anchor="end" fill="#4ade80" font-weight="bold">YES</text>
  </g>

  <!-- ===== column 2: NEW ===== -->
  <rect x="560" y="288" width="440" height="300" rx="12" fill="#2a1424" stroke="#f472b6" stroke-width="2.5"/>
  <rect x="560" y="288" width="440" height="46" rx="12" fill="#f472b6" opacity="0.18"/>
  <text x="780" y="319" text-anchor="middle" font-family="'Courier New', monospace" font-size="19" font-weight="bold" fill="#f9a8d4">ENGINE_NEW</text>
  <g font-family="'Courier New', monospace" font-size="14">
    <text x="582" y="368" fill="#94a3b8">the 5.x graph engine, default</text>
    <text x="582" y="398" fill="#cbd5e1">ONNX coverage</text><text x="978" y="398" text-anchor="end" fill="#4ade80">&gt; 80%</text>
    <text x="582" y="426" fill="#cbd5e1">needs at build time</text>
    <text x="598" y="452" fill="#94a3b8">nothing, always built</text>
    <text x="582" y="482" fill="#cbd5e1">backends</text><text x="978" y="482" text-anchor="end" fill="#93c5fd">CPU only</text>
    <text x="582" y="512" fill="#cbd5e1">GPU inference</text><text x="978" y="512" text-anchor="end" fill="#ef4444" font-weight="bold">NO (5.0.x)</text>
    <text x="582" y="552" fill="#fca5a5">setPreferableBackend(CUDA)</text>
    <text x="582" y="574" fill="#fca5a5">warns once, then is ignored</text>
  </g>

  <!-- ===== column 3: ORT ===== -->
  <rect x="1060" y="288" width="440" height="300" rx="12" fill="#0f2035" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="1060" y="288" width="440" height="46" rx="12" fill="#38bdf8" opacity="0.18"/>
  <text x="1280" y="319" text-anchor="middle" font-family="'Courier New', monospace" font-size="19" font-weight="bold" fill="#7dd3fc">ENGINE_ORT</text>
  <g font-family="'Courier New', monospace" font-size="14">
    <text x="1082" y="368" fill="#94a3b8">ONNX Runtime, wrapped</text>
    <text x="1082" y="398" fill="#cbd5e1">ONNX coverage</text><text x="1478" y="398" text-anchor="end" fill="#4ade80">full</text>
    <text x="1082" y="426" fill="#cbd5e1">needs at build time</text>
    <text x="1098" y="452" fill="#7dd3fc">WITH_ONNXRUNTIME=ON</text>
    <text x="1098" y="474" fill="#7dd3fc">DOWNLOAD_ONNXRUNTIME_GPU</text>
    <text x="1098" y="496" fill="#64748b">Linux x64 / Win x64 only</text>
    <text x="1082" y="526" fill="#cbd5e1">backends</text><text x="1478" y="526" text-anchor="end" fill="#93c5fd">CPU + CUDA EP</text>
    <text x="1082" y="556" fill="#cbd5e1">GPU inference</text><text x="1478" y="556" text-anchor="end" fill="#4ade80" font-weight="bold">YES (CUDA EP)</text>
  </g>

  <!-- arrows to hardware -->
  <line x1="200" y1="588" x2="250" y2="670" stroke="#76b900" stroke-width="2.5" marker-end="url(#ar-green)"/>
  <path d="M 430 588 L 430 648 L 1050 648 L 1090 666" fill="none" stroke="#76b900" stroke-width="2.5" marker-end="url(#ar-green)"/>
  <line x1="700" y1="588" x2="500" y2="670" stroke="#f472b6" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="940" y1="592" x2="940" y2="612" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 5"/>
  <g stroke="#ef4444" stroke-width="3">
    <line x1="932" y1="618" x2="948" y2="634"/>
    <line x1="948" y1="618" x2="932" y2="634"/>
  </g>
  <text x="962" y="631" font-family="'Courier New', monospace" font-size="13" fill="#ef4444">no path to the GPU</text>
  <line x1="1300" y1="588" x2="1300" y2="670" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- hardware lane -->
  <rect x="60" y="676" width="700" height="100" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="410" y="720" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#94a3b8">CPU</text>
  <text x="410" y="750" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#64748b">always available, always correct, always slower</text>

  <rect x="800" y="676" width="700" height="100" rx="12" fill="#14210a" stroke="#76b900" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1150" y="720" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#a3e635">NVIDIA GPU</text>
  <text x="1150" y="750" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#64748b">reachable only through ENGINE_CLASSIC or ENGINE_ORT</text>

  <text x="780" y="808" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#64748b">
    Every one of these paths is decided at build time; the only one that reports its own absence is the CUDA backend.
  </text>
</svg>
