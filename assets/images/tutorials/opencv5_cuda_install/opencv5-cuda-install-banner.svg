<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <defs>
    <radialGradient id="glow_build" cx="50%" cy="52%" r="68%">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="layerfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#76b900" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="480" fill="#0d1117"/>
  <rect width="1280" height="480" fill="url(#glow_build)"/>

  <!-- faint build grid -->
  <g opacity="0.07" stroke="#76b900" stroke-width="1">
    <line x1="0" y1="60" x2="1280" y2="60"/>   <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="180" x2="1280" y2="180"/> <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="300" x2="1280" y2="300"/> <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="420" x2="1280" y2="420"/>
    <line x1="80"  y1="0" x2="80"  y2="480"/> <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/> <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="960" y1="0" x2="960" y2="480"/> <line x1="1040" y1="0" x2="1040" y2="480"/>
    <line x1="1120" y1="0" x2="1120" y2="480"/> <line x1="1200" y1="0" x2="1200" y2="480"/>
  </g>

  <!-- LEFT: the stack you are about to build -->
  <g font-family="'Courier New', monospace" font-size="15" font-weight="bold">
    <rect x="56" y="72"  width="300" height="46" rx="6" fill="url(#layerfade)" stroke="#76b900" stroke-width="2" opacity="0.9"/>
    <text x="72" y="101" fill="#a3e635">NVIDIA driver</text>
    <text x="336" y="101" text-anchor="end" fill="#64748b">nvidia-open</text>

    <rect x="56" y="130" width="300" height="46" rx="6" fill="url(#layerfade)" stroke="#76b900" stroke-width="2" opacity="0.9"/>
    <text x="72" y="159" fill="#a3e635">CUDA Toolkit</text>
    <text x="336" y="159" text-anchor="end" fill="#64748b">nvcc</text>

    <rect x="56" y="188" width="300" height="46" rx="6" fill="url(#layerfade)" stroke="#76b900" stroke-width="2" opacity="0.9"/>
    <text x="72" y="217" fill="#a3e635">cuDNN 9</text>
    <text x="336" y="217" text-anchor="end" fill="#64748b">libcudnn9</text>

    <rect x="56" y="246" width="300" height="46" rx="6" fill="#0f2d4a" stroke="#38bdf8" stroke-width="2" opacity="0.95"/>
    <text x="72" y="275" fill="#93c5fd">opencv_contrib</text>
    <text x="336" y="275" text-anchor="end" fill="#64748b">cudev</text>

    <rect x="56" y="304" width="300" height="46" rx="6" fill="#0f2d4a" stroke="#38bdf8" stroke-width="2" opacity="0.95"/>
    <text x="72" y="333" fill="#93c5fd">opencv 5.0.0</text>
    <text x="336" y="333" text-anchor="end" fill="#64748b">dnn + cuda</text>

    <rect x="56" y="362" width="300" height="46" rx="6" fill="#1f2937" stroke="#fbbf24" stroke-width="2" opacity="0.95"/>
    <text x="72" y="391" fill="#fbbf24">your pipeline</text>
    <text x="336" y="391" text-anchor="end" fill="#64748b">GPU</text>
  </g>

  <!-- RIGHT: the CMake summary you are looking for -->
  <rect x="900" y="96" width="324" height="196" rx="8" fill="#010409" stroke="#334155" stroke-width="1.5"/>
  <circle cx="920" cy="114" r="5" fill="#ef4444"/>
  <circle cx="938" cy="114" r="5" fill="#fbbf24"/>
  <circle cx="956" cy="114" r="5" fill="#4ade80"/>
  <g font-family="'Courier New', monospace" font-size="13">
    <text x="916" y="152" fill="#94a3b8">--   NVIDIA CUDA:</text>
    <text x="1216" y="152" text-anchor="end" fill="#4ade80" font-weight="bold">YES</text>
    <text x="916" y="176" fill="#94a3b8">--     GPU arch:</text>
    <text x="1216" y="176" text-anchor="end" fill="#a3e635">8.6</text>
    <text x="916" y="200" fill="#94a3b8">--   cuDNN:</text>
    <text x="1216" y="200" text-anchor="end" fill="#4ade80" font-weight="bold">YES</text>
    <text x="916" y="224" fill="#94a3b8">--   Python 3:</text>
    <text x="1216" y="224" text-anchor="end" fill="#4ade80" font-weight="bold">YES</text>
    <text x="916" y="248" fill="#94a3b8">--   numpy:</text>
    <text x="1216" y="248" text-anchor="end" fill="#a3e635">2.x</text>
    <text x="916" y="276" fill="#475569">--   ENGINE_CLASSIC</text>
    <text x="1216" y="276" text-anchor="end" fill="#38bdf8">CUDA</text>
  </g>
  <g font-family="'Courier New', monospace" font-size="13" fill="#64748b">
    <text x="900" y="332">$ cmake -D WITH_CUDA=ON \</text>
    <text x="968" y="354">-D WITH_CUDNN=ON \</text>
    <text x="968" y="376">-D OPENCV_DNN_CUDA=ON</text>
  </g>

  <!-- Text block -->
  <text x="640" y="190" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="82" font-weight="900" fill="#76b900" letter-spacing="4">OPENCV 5</text>
  <text x="640" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="300" fill="#ffffff" letter-spacing="4" opacity="0.92">CUDA + cuDNN + DNN</text>
  <text x="640" y="280" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#38bdf8" letter-spacing="2">Ubuntu 24.04 LTS &#183; from source</text>
  <text x="640" y="332" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#64748b">build &#183; verify &#183; do not trust the silence</text>
</svg>
