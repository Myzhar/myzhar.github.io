<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <defs>
    <radialGradient id="glow_ros" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#22b3d1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="480" fill="#0d1117"/>

  <!-- Node graph edges (left cluster) -->
  <g stroke="#22b3d1" stroke-width="1.2" opacity="0.30">
    <line x1="120" y1="100" x2="220" y2="160"/>
    <line x1="120" y1="100" x2="80"  y2="220"/>
    <line x1="220" y1="160" x2="80"  y2="220"/>
    <line x1="220" y1="160" x2="260" y2="280"/>
    <line x1="80"  y1="220" x2="160" y2="340"/>
    <line x1="260" y1="280" x2="160" y2="340"/>
    <line x1="260" y1="280" x2="320" y2="200"/>
    <line x1="120" y1="100" x2="60"  y2="60"/>
    <line x1="320" y1="200" x2="380" y2="140"/>
    <line x1="160" y1="340" x2="100" y2="400"/>
    <line x1="260" y1="280" x2="200" y2="380"/>
  </g>
  <!-- Node graph edges (right cluster) -->
  <g stroke="#22b3d1" stroke-width="1.2" opacity="0.30">
    <line x1="1160" y1="100" x2="1060" y2="160"/>
    <line x1="1160" y1="100" x2="1200" y2="220"/>
    <line x1="1060" y1="160" x2="1200" y2="220"/>
    <line x1="1060" y1="160" x2="1020" y2="280"/>
    <line x1="1200" y1="220" x2="1120" y2="340"/>
    <line x1="1020" y1="280" x2="1120" y2="340"/>
    <line x1="1020" y1="280" x2="960"  y2="200"/>
    <line x1="1160" y1="100" x2="1220" y2="60"/>
    <line x1="960"  y1="200" x2="900"  y2="140"/>
    <line x1="1120" y1="340" x2="1180" y2="400"/>
    <line x1="1020" y1="280" x2="1080" y2="380"/>
  </g>

  <!-- Node circles (left) -->
  <g fill="#22b3d1">
    <circle cx="120" cy="100" r="10" opacity="0.6"/>
    <circle cx="220" cy="160" r="8"  opacity="0.5"/>
    <circle cx="80"  cy="220" r="9"  opacity="0.55"/>
    <circle cx="260" cy="280" r="11" opacity="0.65"/>
    <circle cx="160" cy="340" r="8"  opacity="0.5"/>
    <circle cx="320" cy="200" r="7"  opacity="0.45"/>
    <circle cx="60"  cy="60"  r="6"  opacity="0.40"/>
    <circle cx="380" cy="140" r="6"  opacity="0.40"/>
    <circle cx="100" cy="400" r="6"  opacity="0.38"/>
    <circle cx="200" cy="380" r="5"  opacity="0.35"/>
  </g>
  <!-- Node circles (right) -->
  <g fill="#22b3d1">
    <circle cx="1160" cy="100" r="10" opacity="0.6"/>
    <circle cx="1060" cy="160" r="8"  opacity="0.5"/>
    <circle cx="1200" cy="220" r="9"  opacity="0.55"/>
    <circle cx="1020" cy="280" r="11" opacity="0.65"/>
    <circle cx="1120" cy="340" r="8"  opacity="0.5"/>
    <circle cx="960"  cy="200" r="7"  opacity="0.45"/>
    <circle cx="1220" cy="60"  r="6"  opacity="0.40"/>
    <circle cx="900"  cy="140" r="6"  opacity="0.40"/>
    <circle cx="1180" cy="400" r="6"  opacity="0.38"/>
    <circle cx="1080" cy="380" r="5"  opacity="0.35"/>
  </g>

  <!-- Connecting edges to center -->
  <g stroke="#22b3d1" stroke-width="1" opacity="0.18">
    <line x1="380" y1="140" x2="490" y2="200"/>
    <line x1="320" y1="200" x2="490" y2="240"/>
    <line x1="900" y1="140" x2="790" y2="200"/>
    <line x1="960" y1="200" x2="790" y2="240"/>
  </g>

  <!-- Central glow -->
  <ellipse cx="640" cy="240" rx="480" ry="260" fill="url(#glow_ros)"/>

  <!-- ROS 2 logo-inspired ring -->
  <circle cx="640" cy="240" r="90" fill="none" stroke="#22b3d1" stroke-width="1.5" opacity="0.20"/>
  <circle cx="640" cy="240" r="70" fill="none" stroke="#22b3d1" stroke-width="1" opacity="0.15"/>

  <!-- Text -->
  <text x="640" y="210" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="80" font-weight="900" fill="#22b3d1" letter-spacing="4">ROS 2</text>
  <text x="640" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="300" fill="#ffffff" letter-spacing="8" opacity="0.85">TUTORIALS</text>
</svg>
