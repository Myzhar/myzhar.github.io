<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <defs>
    <radialGradient id="glow_cv" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="480" fill="#0d1117"/>
  <rect width="1280" height="480" fill="url(#glow_cv)"/>

  <!-- Pixel grid (image sensor motif) -->
  <g opacity="0.10" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="40" x2="1280" y2="40"/>   <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="120" x2="1280" y2="120"/> <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="200" x2="1280" y2="200"/> <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="280" x2="1280" y2="280"/> <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="360" x2="1280" y2="360"/> <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="440" x2="1280" y2="440"/>
    <line x1="40" y1="0" x2="40" y2="480"/>     <line x1="80" y1="0" x2="80" y2="480"/>
    <line x1="120" y1="0" x2="120" y2="480"/>   <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="480"/>   <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="280" y1="0" x2="280" y2="480"/>   <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="360" y1="0" x2="360" y2="480"/>   <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="880" y1="0" x2="880" y2="480"/>   <line x1="920" y1="0" x2="920" y2="480"/>
    <line x1="960" y1="0" x2="960" y2="480"/>   <line x1="1000" y1="0" x2="1000" y2="480"/>
    <line x1="1040" y1="0" x2="1040" y2="480"/> <line x1="1080" y1="0" x2="1080" y2="480"/>
    <line x1="1120" y1="0" x2="1120" y2="480"/> <line x1="1160" y1="0" x2="1160" y2="480"/>
    <line x1="1200" y1="0" x2="1200" y2="480"/> <line x1="1240" y1="0" x2="1240" y2="480"/>
  </g>

  <!-- Detection boxes, left cluster -->
  <g fill="none" stroke-width="3">
    <rect x="70"  y="70"  width="150" height="200" rx="4" stroke="#38bdf8" opacity="0.75"/>
    <rect x="248" y="150" width="120" height="120" rx="4" stroke="#4ade80" opacity="0.65"/>
    <rect x="120" y="300" width="200" height="110" rx="4" stroke="#fbbf24" opacity="0.6"/>
  </g>
  <g font-family="'Courier New', monospace" font-size="15" font-weight="bold">
    <rect x="70"  y="48"  width="88"  height="22" fill="#38bdf8" opacity="0.85"/>
    <text x="76"  y="64"  fill="#0d1117">person</text>
    <rect x="248" y="128" width="60"  height="22" fill="#4ade80" opacity="0.85"/>
    <text x="254" y="144" fill="#0d1117">dog</text>
    <rect x="120" y="278" width="60"  height="22" fill="#fbbf24" opacity="0.85"/>
    <text x="126" y="294" fill="#0d1117">car</text>
  </g>

  <!-- Detection boxes, right cluster -->
  <g fill="none" stroke-width="3">
    <rect x="960"  y="90"  width="130" height="170" rx="4" stroke="#38bdf8" opacity="0.75"/>
    <rect x="1120" y="180" width="100" height="90"  rx="4" stroke="#f472b6" opacity="0.6"/>
    <rect x="930"  y="310" width="160" height="100" rx="4" stroke="#4ade80" opacity="0.6"/>
  </g>
  <g font-family="'Courier New', monospace" font-size="15" font-weight="bold">
    <rect x="960"  y="68"  width="88"  height="22" fill="#38bdf8" opacity="0.85"/>
    <text x="966"  y="84"  fill="#0d1117">person</text>
    <rect x="1120" y="158" width="52"  height="22" fill="#f472b6" opacity="0.85"/>
    <text x="1126" y="174" fill="#0d1117">cup</text>
    <rect x="930"  y="288" width="76"  height="22" fill="#4ade80" opacity="0.85"/>
    <text x="936"  y="304" fill="#0d1117">laptop</text>
  </g>

  <!-- Center reticle ticks -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.35">
    <path d="M 470 150 h -30 v 30" fill="none"/>
    <path d="M 810 150 h 30 v 30" fill="none"/>
    <path d="M 470 330 h -30 v -30" fill="none"/>
    <path d="M 810 330 h 30 v -30" fill="none"/>
  </g>

  <!-- Text -->
  <text x="640" y="222" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="80" font-weight="900" fill="#38bdf8" letter-spacing="4">OPENCV</text>
  <text x="640" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="300" fill="#ffffff" letter-spacing="8" opacity="0.85">TUTORIALS</text>
</svg>
